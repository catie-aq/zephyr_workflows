name: Build & Test Zephyr Driver

on:
  workflow_call:
    inputs:
      boards:
        required: false
        type: string
        default: "zest_core_stm32l4a6rg"
      container:
        required: false
        type: string
        default: "ghcr.io/catie-aq/zephyr_docker:v4.3.0-202511-ci"
      extra_cmd:
        required: false
        type: string
        description: "Extra command to run before build"
        default: ""
      path:
        required: false
        type: string
        default: "samples"
      zephyr_modules:
        required: false
        type: string
        description: "Comma-separated list of Zephyr modules to include in name-allowlist (e.g., 'cmsis,cmsis_6,hal_stm32')"
        default: "hal_stm32"
      has_manifest:
        required: false
        type: boolean
        description: "Import the driver's manifest (west.yml)"
        default: false
    secrets:
      personal_access_token:
        required: true

jobs:
  pre-commit:
    uses: catie-aq/generic_workflows/.github/workflows/pre-commit.yaml@main
  twister:
    runs-on: sonu-github-arc
    container: ${{ inputs.container }}
    env:
      CMAKE_PREFIX_PATH: /opt/toolchains
      ZEPHYR_VERSION: "v4.3.0"
      TWISTER_OPTIONS: "--force-color --inline-logs -v --clobber-output --integration "
    steps:
      - name: Extra command
        if: ${{ inputs.extra_cmd }}
        run: ${{ inputs.extra_cmd }}

      - name: Get current branch name
        id: branch-names
        uses: tj-actions/branch-names@v8

      - name: Create workdir/west.yml
        shell: bash
        run: |
          mkdir -p workdir
          touch workdir/west.yml

      - name: Generate YAML file
        shell: bash
        run: |
          cat << EOF > workdir/west.yml
          manifest:
            remotes:
              - name: zephyrproject-rtos
                url-base: https://github.com/zephyrproject-rtos
              - name: catie-6tron
                url-base: https://github.com/catie-aq
            projects:
              - name: zephyr
                remote: zephyrproject-rtos
                revision: ${{ env.ZEPHYR_VERSION }}
                import:
                  name-allowlist:
                    - cmsis
                    - cmsis_6
          EOF
          
          # Add Zephyr modules from the zephyr_modules input parameter
          IFS=',' read -ra MODULES <<< "${{ inputs.zephyr_modules }}"
          for module in "${MODULES[@]}"; do
            module=$(echo "$module" | xargs)  # Trim whitespace
            if [ -n "$module" ]; then
              echo "          - $module" >> workdir/west.yml
            fi
          done

          IFS=',' read -ra BOARDS <<< "${{ inputs.boards }}"
          for board in "${BOARDS[@]}"; do
            board=$(echo "$board" | xargs)  # Trim whitespace
            board=${board//_/-} # Replace underscores with hyphens
            if [ -n "$board" ]; then
              echo "    - name: zephyr_$board" >> workdir/west.yml
              echo "      remote: catie-6tron" >> workdir/west.yml
              echo "      revision: main" >> workdir/west.yml
            fi
          done
          
          # Add other projects
          cat << EOF >> workdir/west.yml
              - name: zephyr_6tron-connector
                remote: catie-6tron
                revision: main
              - name: ${{ github.event.repository.name }}
                remote: catie-6tron
                revision: ${{ steps.branch-names.outputs.current_branch }}
          EOF
          
          # Add import: true conditionally if has_manifest is true
          if [ "${{ inputs.has_manifest }}" = "true" ]; then
            echo "            import: true" >> workdir/west.yml
          fi

      - uses: catie-aq/zephyr_workflows/zephyr_init@main
        with:
          personal_access_token: ${{ secrets.personal_access_token }}

      - uses: catie-aq/zephyr_workflows/zephyr_twister@main
        with:
          path: ${{ github.event.repository.name }}/${{ inputs.path }}
          options: ${{ env.TWISTER_OPTIONS }}
